version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    container_name: rag_app_deployment-elasticsearch-1
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./rag-app
      dockerfile: Dockerfile
    container_name: rag_app_deployment-backend-1
    ports:
      - "8000:8000"
    environment:
      - ES_HOST=http://elasticsearch:9200
      - ES_USER=elastic
      - ES_PASSWORD=
      - INDEX_PATH=/app/indexes_with_overlap_100_chunks_500
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./rag-app/model1:/app/model
      - ./rag-app/indexes_with_overlap_100_chunks_500:/app/indexes_with_overlap_100_chunks_500
    command: /bin/bash -c "/app/init_elasticsearch.sh && uvicorn main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./chatbot-ui
      dockerfile: Dockerfile
    container_name: rag_app_deployment-frontend-1
    ports:
      - "8501:8501"
    environment:
      - FASTAPI_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  esdata:
    driver: local

networks:
  app-network:
    driver: bridge